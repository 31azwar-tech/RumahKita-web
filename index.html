      trips.length===0
      ? h(EmptyTab,{key:'e',title:'Belum ada rencana perjalanan',body:'Tekan "+ Trip" untuk membuat checklist perjalanan pertamamu.'})
      : trips.map(t=>h(TripCard,{key:t.id,t,open:openId===t.id,onToggle:()=>setOpenId(openId===t.id?null:t.id),ctx}))),
  ]);
}
function TripCard({t,open,onToggle,ctx}){
  const {store,openSheet}=ctx;
  const [newItem,setNewItem]=useState('');
  const done=t.items.filter(i=>i.done).length, total=t.items.length;
  const pct=total?done/total:0;
  const durasi=tripDurasi(t.start,t.end);
  const add=()=>{ const v=newItem.trim(); if(!v)return; store.addTripItem(t.id,v); setNewItem(''); };
  return h('div',{style:{marginBottom:12}},h(Card,{pad:false,style:{padding:0,overflow:'hidden'}},[
    // header
    h('button',{key:'hd',style:{width:'100%',textAlign:'left',padding:14,display:'flex',flexDirection:'column',gap:10},onClick:onToggle},[
      h('div',{key:'top',className:'row gap10'},[
        h('div',{key:'ic',style:{width:42,height:42,borderRadius:12,background:C.clay+'22',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}},h(Icon,{name:'location',size:20,color:C.clay})),
        h('div',{key:'g',className:'grow',style:{minWidth:0}},[
          h('div',{key:'d',style:{fontWeight:800,fontSize:16},className:'clamp2'},t.dest),
          h('div',{key:'m',className:'b-sm muted'},`${tanggal(t.start)} – ${tanggal(t.end)} · ${durasi} hari`),
        ]),
        h(Icon,{key:'c',name:open?'up':'down',size:18,color:'var(--inkSoft)'}),
      ]),
      t.note?h('div',{key:'nt',className:'b-sm muted',style:{fontStyle:'italic'}},t.note):null,
      // progress checklist
      h('div',{key:'pr',style:{width:'100%'}},[
        h('div',{key:'l',className:'between',style:{marginBottom:4}},[
          h('span',{key:'a',className:'b-xs muted',style:{fontWeight:600}},`Checklist bawaan ${done}/${total}`),
          h('span',{key:'b',className:'b-xs',style:{fontWeight:700,color:pct>=1?C.income:C.clay}},pct>=1?'Siap! 🎒':`${Math.round(pct*100)}%`),
        ]),
        h('div',{key:'p',className:'progress',style:{height:7}},h('div',{style:{width:(pct*100)+'%',background:pct>=1?C.income:C.clay}})),
      ]),
    ]),
    // body checklist
    open?h('div',{key:'bd',style:{padding:'0 14px 14px'}},[
      ...t.items.map(i=>h('div',{key:i.id,className:'row gap10',style:{padding:'8px 0',borderTop:'1px solid var(--line)'}},[
        h(Check,{key:'c',on:i.done,onChange:()=>store.toggleTripItem(t.id,i.id),size:20}),
        h('span',{key:'t',className:'grow'+(i.done?' strike':''),style:{fontSize:14,color:i.done?'var(--inkSoft)':'var(--ink)'}},i.text),
        h('button',{key:'x',className:'iconbtn-sm',onClick:()=>store.removeTripItem(t.id,i.id)},h(Icon,{name:'close',size:14,color:'var(--inkSoft)'})),
      ])),
      // tambah item
      h('div',{key:'add',className:'row gap8',style:{marginTop:10}},[
        h('input',{key:'in',className:'field grow',value:newItem,placeholder:'Tambah barang…',onChange:e=>setNewItem(e.target.value),onKeyDown:e=>{if(e.key==='Enter')add();}}),
        h('button',{key:'b',className:'btn btn-clay',style:{background:C.clay,color:'#fff',padding:'0 16px'},onClick:add},h(Icon,{name:'plus',size:18,color:'#fff'})),
      ]),
      // aksi
      h('div',{key:'act',className:'row gap8',style:{marginTop:12}},[
        h('button',{key:'e',className:'btn btn-ghost grow',onClick:()=>openSheet('trip',{edit:t})},[h(Icon,{key:'i',name:'edit',size:16}),'Edit']),
        h('button',{key:'d',className:'btn grow',style:{background:C.maroon+'14',color:C.maroon},onClick:()=>{ store.deleteTrip(t.id); toastUndo('Trip dihapus',()=>store.addTrip(t)); }},[h(Icon,{key:'i',name:'trash',size:16,color:C.maroon}),'Hapus']),
      ]),
    ]):null,
  ]));
}
function TripSheet({ctx,edit}){
  const {store,closeSheet}=ctx;
  const [dest,setDest]=useState(edit?edit.dest:'');
  const [note,setNote]=useState(edit?edit.note||'':'');
  const [start,setStart]=useState(edit?toInputDate(edit.start):toInputDate(todayD));
  const [end,setEnd]=useState(edit?toInputDate(edit.end):toInputDate(todayD));
  const [tpl,setTpl]=useState('Umum');
  const save=()=>{
    if(!dest.trim()){toast('Isi tujuan perjalanan');return;}
    const sD=fromInputDate(start), eD=fromInputDate(end);
    if(eD<sD){toast('Tanggal selesai sebelum mulai');return;}
    if(edit){ store.updateTrip({...edit,dest:dest.trim(),note:note.trim(),start:sD,end:eD}); toast('Trip diperbarui'); }
    else{ const items=(TRIP_TEMPLATES[tpl]||[]).map((text,i)=>({id:newId('i'),text,done:false}));
      store.addTrip({dest:dest.trim(),note:note.trim(),start:sD,end:eD,items}); toast('Trip dibuat 🎒'); }
    closeSheet();
  };
  return h('div',null,[
    h(SheetHeader,{key:'h',title:edit?'Edit Trip':'Trip Baru'}),
    h('label',{key:'l0',className:'label'},'Tujuan'),
    h('input',{key:'d',className:'field',style:{marginBottom:14},value:dest,placeholder:'mis. Pantai Parangtritis',onChange:e=>setDest(e.target.value)}),
    h('div',{key:'dt',className:'row gap10',style:{marginBottom:14}},[
      h('div',{key:'s',className:'grow'},[h('label',{key:'l',className:'label'},'Mulai'),h('input',{key:'i',type:'date',className:'field',value:start,onChange:e=>setStart(e.target.value)})]),
      h('div',{key:'e',className:'grow'},[h('label',{key:'l',className:'label'},'Selesai'),h('input',{key:'i',type:'date',className:'field',value:end,onChange:e=>setEnd(e.target.value)})]),
    ]),
    h('label',{key:'l2',className:'label'},'Catatan (opsional)'),
    h('input',{key:'n',className:'field',style:{marginBottom:14},value:note,placeholder:'mis. Liburan keluarga',onChange:e=>setNote(e.target.value)}),
    !edit?h('div',{key:'tpl'},[
      h('label',{key:'l',className:'label'},'Template checklist'),
      h('div',{key:'g',className:'catscroll',style:{marginBottom:6}}, Object.keys(TRIP_TEMPLATES).map(k=>
        h('button',{key:k,className:'catchip'+(tpl===k?' active':''),onClick:()=>setTpl(k)},k))),
      h('div',{key:'h',className:'b-xs muted',style:{marginBottom:16}},`${(TRIP_TEMPLATES[tpl]||[]).length} barang otomatis ditambahkan (bisa diubah nanti).`),
    ]):null,
    h('button',{key:'s',className:'btn',style:{width:'100%',padding:14,background:C.clay,color:'#fff'},onClick:save},edit?'Simpan':'Buat Trip'),
  ]);
}

/* ---- Editor periode manual ---- */
function PeriodEditorSheet({ctx}){
  const {store}=ctx; const s=store.state;
  const nowPer=periodOf(s,FIN_TODAY);
  const [openKey,setOpenKey]=useState(null);
  const [back,setBack]=useState(6);   // berapa periode ke belakang
  const [fwd,setFwd]=useState(3);     // berapa periode ke depan
  const ov=s.settings.periodOverrides||{};
  // daftar periode dari -back s/d +fwd (relatif ke periode kini)
  const list=[]; for(let i=-back;i<=fwd;i++){ const p=shiftPeriod(nowPer.y,nowPer.m,i); list.push(p); }
  list.reverse();
  // pastikan semua override manual tetap tampil walau di luar rentang
  const shownKeys=new Set(list.map(p=>periodKey(p.y,p.m)));
  Object.keys(ov).forEach(k=>{ if(!shownKeys.has(k)){ const [yy,mm]=k.split('-').map(Number); list.push({y:yy,m:mm}); } });
  list.sort((a,b)=>(b.y*12+b.m)-(a.y*12+a.m));

  const row=(p)=>{
    const key=periodKey(p.y,p.m);
    const {start,end}=periodRange(s,p.y,p.m);
    const isOv=!!ov[key];
    const isOpen=openKey===key;
    return h('div',{key:key,className:'pe-row'},[
      h('button',{key:'hd',className:'pe-head',onClick:()=>setOpenKey(isOpen?null:key)},[
        h('div',{key:'g',className:'grow',style:{textAlign:'left'}},[
          h('div',{key:'t',style:{fontWeight:800,fontSize:15}},`${BULAN[p.m-1]} ${p.y}`),
          h('div',{key:'s',className:'b-sm muted'},`${tanggal(start)} – ${tanggal(end)}`),
        ]),
        isOv?h('span',{key:'b',className:'chip',style:{background:C.teal+'1f',color:C.teal,fontWeight:700,marginRight:6}},'Manual'):h('span',{key:'b',className:'chip',style:{background:'var(--surfaceHigh)',color:'var(--inkSoft)',marginRight:6}},'Otomatis'),
        h(Icon,{key:'c',name:isOpen?'up':'down',size:18,color:'var(--inkSoft)'}),
      ]),
      isOpen?h(PeriodEditRow,{key:'ed',ctx,pkey:key,start,end,isOv}):null,
    ]);
  };

  return h('div',null,[
    h(SheetHeader,{key:'h',title:'Atur Periode Manual'}),
    h('div',{key:'info',className:'b-sm muted',style:{marginBottom:12,lineHeight:1.5}},'Tentukan sendiri rentang tanggal tiap periode. Jika tidak diatur, sistem memakai tanggal gajian otomatis.'),
    // muat lebih baru
    h('button',{key:'more-f',className:'btn btn-ghost',style:{width:'100%',padding:10,marginBottom:10},onClick:()=>setFwd(f=>f+6)},
      [h(Icon,{key:'i',name:'up',size:16}),'Muat periode lebih baru']),
    ...list.map(row),
    // muat lebih lama
    h('button',{key:'more-b',className:'btn btn-ghost',style:{width:'100%',padding:10,marginTop:10},onClick:()=>setBack(b=>b+12)},
      [h(Icon,{key:'i',name:'down',size:16}),'Muat periode lebih lama']),
  ]);
}
function PeriodEditRow({ctx,pkey,start,end,isOv}){
  const {store}=ctx;
  const [sv,setSv]=useState(toInputDate(start));
  const [ev,setEv]=useState(toInputDate(end));
  const save=()=>{ const sD=fromInputDate(sv),eD=fromInputDate(ev);
    if(eD<sD){toast('Tanggal selesai sebelum mulai');return;}
    store.setPeriodOverride(pkey,sv,ev); toast('Periode diatur'); };
  const reset=()=>{ store.clearPeriodOverride(pkey); toast('Kembali ke otomatis'); };
  return h('div',{className:'pe-body'},[
    h('div',{key:'dt',className:'row gap10',style:{marginBottom:12}},[
      h('div',{key:'s',className:'grow'},[h('label',{key:'l',className:'label'},'Mulai'),h('input',{key:'i',type:'date',className:'field',value:sv,onChange:e=>setSv(e.target.value)})]),
      h('div',{key:'e',className:'grow'},[h('label',{key:'l',className:'label'},'Selesai'),h('input',{key:'i',type:'date',className:'field',value:ev,onChange:e=>setEv(e.target.value)})]),
    ]),
    h('div',{key:'act',className:'row gap8'},[
      h('button',{key:'s',className:'btn btn-teal grow',style:{padding:11},onClick:save},'Simpan'),
      isOv?h('button',{key:'r',className:'btn btn-ghost',style:{padding:'11px 16px'},onClick:reset},'Otomatis'):null,
    ]),
  ]);
}

/* ---- Edit batas anggaran (menggantikan prompt) ---- */
function BudgetEditSheet({ctx,pkey,label,current}){
  const {store,closeSheet}=ctx;
  const [val,setVal]=useState(current||0);
  const save=()=>{ store.setBudget(pkey,val||0); closeSheet(); toast('Batas anggaran diperbarui'); };
  return h('div',null,[
    h(SheetHeader,{key:'h',title:'Batas Anggaran'}),
    h('div',{key:'p',className:'b-sm muted',style:{marginBottom:14}},`Periode ${label}. Ini plafon belanja target, bukan saldo. Sisa Anggaran = batas − pengeluaran.`),
    h('label',{key:'l',className:'label'},'Nominal batas'),
    h('div',{key:'m',style:{marginBottom:18}},h(MoneyInput,{value:val,onChange:setVal,placeholder:'mis. 5.000.000'})),
    h('button',{key:'s',className:'btn btn-teal',style:{width:'100%',padding:14},onClick:save},'Simpan'),
  ]);
}
/* ---- Edit tanggal gajian default (menggantikan prompt) ---- */
function PaydayEditSheet({ctx,current}){
  const {store,closeSheet}=ctx;
  const [val,setVal]=useState(String(current||28));
  const save=()=>{ const n=parseInt(val,10); if(n>=1&&n<=31){store.setPayday(n);closeSheet();toast('Tanggal gajian: '+n);} else toast('Masukkan 1–31'); };
  return h('div',null,[
    h(SheetHeader,{key:'h',title:'Tanggal Gajian Default'}),
    h('div',{key:'p',className:'b-sm muted',style:{marginBottom:14}},'Dipakai sebagai awal periode bila belum ada transaksi gaji pada bulan itu.'),
    h('label',{key:'l',className:'label'},'Tanggal (1–31)'),
    h('input',{key:'i',type:'number',min:1,max:31,className:'field',style:{marginBottom:14},value:val,onChange:e=>setVal(e.target.value)}),
    // pilihan cepat
    h('div',{key:'q',className:'catscroll',style:{marginBottom:18}}, [1,25,26,27,28,29,30].map(d=>
      h('button',{key:d,className:'catchip'+(parseInt(val,10)===d?' active':''),onClick:()=>setVal(String(d))},'tgl '+d))),
    h('button',{key:'s',className:'btn btn-teal',style:{width:'100%',padding:14},onClick:save},'Simpan'),
  ]);
}
